<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
  <title id="title">昇腾 NPU 内存与通信架构</title>
  <desc id="desc">软件层包括 vLLM、Connector、Offload Manager、Memcache、MemFabric 和 HCCL。MemFabric 下接 SDMA、Device RDMA 和 Device URMA。硬件层展示 Host DRAM、NPU HBM 和远端节点，以及 PCIe、HCCS、UB、RoCE 互连。箭头代表概念依赖，不代表固定传输路径。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52677e"/></marker></defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#172d43;font-size:19px}
    .title{font-size:28px;font-weight:700}.label{font-size:17px;fill:#53687c}.bold{font-weight:600}.small{font-size:16px;fill:#53687c}
    .group{fill:#f0f5fa;stroke:#cedbe7}.box{fill:#fff;stroke:#a7bdd2;stroke-width:1.5}.green{fill:#edf8f3;stroke:#9fc7b4;stroke-width:1.5}
    .line{fill:none;stroke:#52677e;stroke-width:1.7;marker-end:url(#a)}.dashed{stroke-dasharray:6 5}
  </style>
  <rect width="1000" height="1100" rx="18" fill="#fafcfe"/>
  <text x="500" y="48" class="title">昇腾 NPU：内存与通信栈</text>
  <text x="500" y="79" class="label">位置 · 链路 · 搬运机制 · 软件组织</text>
  <rect x="300" y="104" width="400" height="54" rx="10" class="box"/>
  <text x="500" y="138" class="bold">vLLM 推理应用</text>
  <rect x="30" y="190" width="940" height="310" rx="14" class="group"/>
  <text x="125" y="220" class="label">软件组织层</text>
  <rect x="65" y="244" width="530" height="57" rx="9" class="box"/>
  <text x="330" y="279">KV Connector / Offload Manager</text>
  <rect x="650" y="244" width="280" height="220" rx="9" class="green"/>
  <text x="790" y="300" class="bold">HCCL</text>
  <text x="790" y="337">组织多卡通信</text>
  <text x="790" y="373" class="small">AllReduce / AllGather</text>
  <text x="790" y="404" class="small">Broadcast 等</text>
  <text x="790" y="440" class="small">按拓扑选择算法与路径</text>
  <rect x="65" y="329" width="225" height="57" rx="9" class="box"/>
  <text x="177" y="364">Memcache 缓存服务</text>
  <rect x="65" y="414" width="530" height="57" rx="9" class="box"/>
  <text x="330" y="449">MemFabric：统一编址与内存复制</text>
  <path d="M400 158V180H330V240M600 158V180H790V240M177 301V325M177 386V410M440 301V410" class="line"/>
  <rect x="30" y="535" width="625" height="150" rx="14" class="group"/>
  <text x="342" y="565" class="label">MemFabric 可选后端（抽象层次并不完全相同）</text>
  <rect x="50" y="587" width="180" height="74" rx="9" class="box"/>
  <text x="140" y="617" class="bold">SDMA</text><text x="140" y="646" class="small">硬件搬运引擎</text>
  <rect x="250" y="587" width="180" height="74" rx="9" class="box"/>
  <text x="340" y="617" class="bold">Device RDMA</text><text x="340" y="646" class="small">远程内存访问路径</text>
  <rect x="450" y="587" width="180" height="74" rx="9" class="box"/>
  <text x="540" y="617" class="bold">Device URMA</text><text x="540" y="646" class="small">UB 通信接口路径</text>
  <path d="M330 471V515H40V575H540V583M140 575V583M340 575V583" class="line"/>
  <rect x="30" y="745" width="940" height="265" rx="14" class="group"/>
  <text x="500" y="780" class="label">硬件与存储层：实际链路由设备、驱动和拓扑决定</text>
  <rect x="60" y="820" width="200" height="80" rx="9" class="box"/>
  <text x="160" y="852" class="bold">Host DRAM</text><text x="160" y="883" class="small">CPU 主内存</text>
  <rect x="370" y="820" width="220" height="80" rx="9" class="box"/>
  <text x="480" y="852" class="bold">NPU A · HBM</text><text x="480" y="883" class="small">设备显存</text>
  <rect x="720" y="820" width="220" height="80" rx="9" class="box"/>
  <text x="830" y="852" class="bold">NPU B · HBM</text><text x="830" y="883" class="small">设备显存</text>
  <path d="M260 860H366M590 860H716" class="line"/>
  <text x="315" y="842" class="small">PCIe 等</text><text x="655" y="810" class="small">HCCS / PCIe P2P</text>
  <rect x="370" y="935" width="570" height="52" rx="9" class="green"/>
  <text x="655" y="968">远端节点：Host DRAM 或 NPU HBM</text>
  <path d="M480 900V931" class="line"/>
  <text x="730" y="924" class="small">HCCS / UB / RoCE 等互连</text>
  <path d="M140 661V718H340V741M340 661V741M540 661V718H340M790 464V741" class="line dashed"/>
  <text x="500" y="1046" class="small">实线：调用关系或示意数据通路；虚线：使用下层硬件资源</text>
  <text x="500" y="1075" class="small">不要求每次通信经过所有模块；P2P 是否可用需核对平台支持</text>
</svg>
